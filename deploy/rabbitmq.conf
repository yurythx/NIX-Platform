# consumer_timeout: o RabbitMQ força o fechamento (com precondition_failed)
# do canal de qualquer consumidor que segure uma entrega SEM ack por mais
# tempo que este valor — o fechamento do canal devolve a entrega não-ackada
# pro broker, que a redistribui de novo pra fila (redelivery nativa),
# concorrendo com o retry-com-backoff que a própria aplicação já implementa
# (internal/platform/messaging/consumer.go) por cima disso.
#
# Bug real encontrado nesta base de código (validação do scanner OWASP ZAP
# contra um alvo real): o padrão do RabbitMQ (1800000ms = 30min) colidiu
# quase exatamente com SCANNING_ZAP_SCAN_TIMEOUT (também 30min na época) —
# um scan ativo de ZAP genuinamente ainda rodando aos 30min (nenhum erro,
# só um alvo grande) fazia o RabbitMQ fechar o canal e redistribuir a MESMA
# entrega enquanto o handler original ainda a processava, gerando dois
# processamentos concorrentes do mesmo job — um deles sempre esbarrava
# num "invalid transition processing -> processing" (internal/platform/
# jobs/repository.go) e, esgotadas as tentativas, ia pra dead-letter sem
# nunca conseguir gravar isso (mesma trava), deixando o job PRESO pra
# sempre em "processing".
#
# 3h de folga cobre qualquer handler síncrono desta plataforma — hoje, o
# mais longo é o scan de ZAP (SCANNING_ZAP_SCAN_TIMEOUT no .env, veja
# scanning/infrastructure/zap_scanner.go). Sempre que esse timeout for
# aumentado, este valor precisa continuar maior — os dois nunca podem ficar
# perto um do outro de novo.
consumer_timeout = 10800000
