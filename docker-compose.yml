name: nix-platform

networks:
  nix_internal:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  # scanning_workspace (§ Containerização — cada scanner isolado no seu
  # próprio container, como o GitGuard, decisão explícita do usuário):
  # compartilhado entre backend-worker (que clona o alvo aqui — leitura E
  # escrita) e cada sidecar de scanner (trivy-scanner, gitleaks-scanner,
  # syft-scanner, semgrep-scanner, e os que vierem depois — só leitura,
  # ver docker-compose.yml abaixo). O worker continua dono do ciclo de vida:
  # cria o diretório antes do scan, apaga depois — nenhum sidecar escreve
  # nem limpa nada aqui.
  scanning_workspace:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nix}
      POSTGRES_USER: ${DB_USER:-nix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nix_internal
    # No public port mapping — PostgreSQL is never exposed externally by
    # default (§6/§60). docker-compose.dev.yml adds a mapping for local
    # development only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nix} -d ${DB_NAME:-nix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-nix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-nix}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # consumer_timeout mais generoso que qualquer handler síncrono desta
      # plataforma (deploy/rabbitmq.conf explica o bug real que o padrão de
      # 30min do RabbitMQ causou, colidindo com o timeout do scan de ZAP) —
      # sem isto, o RabbitMQ fecha o canal e redistribui uma entrega ainda
      # legitimamente em processamento, duplicando o handler.
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/conf.d/consumer_timeout.conf:ro
    networks:
      - nix_internal
    # Neither the AMQP port nor the management UI is published externally
    # by default (§15/§60). docker-compose.dev.yml opens the management UI
    # for local development only.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # sonarqube-db/sonarqube: infraestrutura da Fase 5 do roadmap de
  # segurança (SonarQube, qualidade de código/bugs — SAST complementar ao
  # Semgrep). Ao contrário de trivy/semgrep (só binários rodados sob
  # demanda dentro do worker), o SonarQube é um servidor de vida longa com
  # estado próprio — decisão explícita do usuário (self-hosted via Docker
  # Compose, não SonarCloud) registrada em
  # docs/roadmap-secops-orchestrator.md. Banco de dados dedicado, não
  # compartilhado com o `postgres` da aplicação: o SonarQube gerencia seu
  # próprio schema/migrations internamente, fora do controle do goose
  # desta plataforma — misturar os dois no mesmo servidor Postgres
  # acoplaria dois ciclos de vida de schema independentes sem necessidade.
  sonarqube-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?SONARQUBE_DB_PASSWORD must be set}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - nix_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sonarqube:
    image: sonarqube:26.8.0.126808-community
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?SONARQUBE_DB_PASSWORD must be set}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - nix_internal
    # Requisito documentado do próprio SonarQube (bootstrap check do
    # Elasticsearch embutido): descritores de arquivo e processos altos.
    # vm.max_map_count (>= 262144) é um sysctl de host, não namespaced por
    # container — não dá pra setar aqui; precisa estar configurado no
    # host onde este compose roda (`sysctl -w vm.max_map_count=262144`).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    depends_on:
      sonarqube-db:
        condition: service_healthy
    # Não exposto por padrão (mesmo princípio de postgres/rabbitmq acima)
    # — docker-compose.dev.yml publica a porta 9000 (console web) pra
    # acesso local. start_period generoso: o SonarQube pode levar mais de
    # um minuto pra ficar pronto no primeiro boot (migração do schema +
    # bootstrap do Elasticsearch embutido).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # zap: infraestrutura da Fase 6 do roadmap de segurança (OWASP ZAP,
  # DAST — a fase de maior risco de todas: dispara ataques ativos contra
  # um alvo rodando de verdade, decisão explícita do usuário registrada
  # em docs/roadmap-secops-orchestrator.md). Ao contrário de
  # trivy/semgrep/sonar-scanner (processos rodados dentro do próprio
  # worker), o ZAP roda como um daemon de vida longa com sua API REST
  # habilitada; o worker fala com essa API via HTTP (ver
  # internal/modules/scanning/infrastructure/zap_scanner.go), nunca
  # invoca um binário ZAP diretamente. api.key é obrigatório — sem ele,
  # qualquer container na mesma rede poderia disparar ataques através
  # deste serviço.
  zap:
    image: zaproxy/zap-stable:2.17.0
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${SCANNING_ZAP_API_KEY:?SCANNING_ZAP_API_KEY must be set}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    networks:
      - nix_internal
    # Não exposto por padrão — só o worker (mesma rede interna) precisa
    # falar com a API deste serviço.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://127.0.0.1:8080/JSON/core/view/version/?apikey=${SCANNING_ZAP_API_KEY}' | grep -q version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-nix}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-nix}
    volumes:
      # A chave privada RSA do login local (§ ADR 003) — nunca no
      # controle de versão, montada somente leitura no mesmo caminho que
      # LOCAL_AUTH_PRIVATE_KEY_FILE aponta no .env.example. O mesmo padrão
      # que Docker Secrets/Kubernetes Secrets usam (ver o comentário de
      # loader.secret em internal/platform/config/config.go) — um bind
      # mount local é só o jeito mais simples de reproduzir isso em dev.
      - ./secrets:/run/secrets:ro
    networks:
      - nix_internal
    ports:
      # Os dois lados usam a mesma HTTP_PORT: o processo dentro do
      # container também lê essa variável (via env_file) para decidir em
      # qual porta escutar (§62) — mapear para um container-side fixo
      # quebraria a publicação se HTTP_PORT for customizada no .env.
      - "${HTTP_PORT:-8000}:${HTTP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # 127.0.0.1, não "localhost": Alpine/musl resolve "localhost" para o
    # IPv6 loopback (::1) primeiro dentro do container, e nem todo
    # servidor aceita conexões nesse endereço (o Go dual-stack aceita por
    # padrão hoje, mas depender disso é frágil — ver a nota equivalente no
    # serviço frontend, onde essa mesma ambiguidade quebrava de verdade o
    # healthcheck do servidor standalone do Next.js).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${HTTP_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-nix}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-nix}
      # Endereços internos dos sidecars de scanning (§ Containerização) +
      # o diretório compartilhado com eles — nomes de serviço do Compose,
      # só resolvíveis dentro da rede `nix_internal`. Corrige uma lacuna
      # real: até esta mudança, nenhum destes 5 valores tinha um default
      # aqui, então SCANNING_*_SERVICE_URL/SCANNING_WORKSPACE_DIR
      # dependiam inteiramente de serem preenchidos manualmente num `.env`
      # não versionado — um `docker compose up` seguindo só o README (`cp
      # .env.example .env`, sem editar mais nada) reportaria os quatro
      # scanners containerizados como "indisponível" apesar dos
      # containers dos sidecars estarem de pé e saudáveis. Sobrescrevem
      # (nunca são sobrescritos por) qualquer valor vazio herdado do
      # `env_file: .env` acima, mesmo princípio de DB_HOST/RABBITMQ_URL
      # já fixados neste mesmo bloco.
      SCANNING_TRIVY_SERVICE_URL: http://trivy-scanner:8080
      SCANNING_GITLEAKS_SERVICE_URL: http://gitleaks-scanner:8080
      SCANNING_SYFT_SERVICE_URL: http://syft-scanner:8080
      SCANNING_SEMGREP_SERVICE_URL: http://semgrep-scanner:8080
      SCANNING_WORKSPACE_DIR: /workspace
    volumes:
      - ./secrets:/run/secrets:ro
      # scanning_workspace (§ Containerização, ver comentário na seção
      # `volumes:` no topo deste arquivo): TrivyScanner.Execute/
      # GitleaksScanner.Execute/SyftScanner.Inventory/SemgrepScanner.Execute
      # clonam o alvo aqui (leitura E escrita — o worker é dono do ciclo
      # de vida), os sidecars trivy-scanner/gitleaks-scanner/syft-scanner/
      # semgrep-scanner só leem o mesmo caminho.
      - scanning_workspace:/workspace
    networks:
      - nix_internal
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      trivy-scanner:
        condition: service_healthy
      gitleaks-scanner:
        condition: service_healthy
      syft-scanner:
        condition: service_healthy
      semgrep-scanner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${WORKER_METRICS_PORT:-9100}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # trivy-scanner (§ Containerização — cada scanner isolado no seu
  # próprio container, decisão explícita do usuário: "gitguard usa cada
  # solução containerizada, vamos fazer do mesmo jeito"): mesmo padrão
  # que sonarqube/zap já seguiam — um serviço de vida longa com API HTTP
  # própria, em vez do binário instalado dentro da imagem do worker. Só
  # lê o volume compartilhado (nunca escreve nem limpa) — o worker
  # continua dono de criar/apagar o diretório clonado.
  trivy-scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.trivy-sidecar
    restart: unless-stopped
    volumes:
      - scanning_workspace:/workspace:ro
    networks:
      - nix_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # gitleaks-scanner (§ Containerização — Fase 11, mesmo padrão de
  # trivy-scanner acima): sidecar de vida longa em torno do binário
  # `gitleaks`, só lê o volume compartilhado.
  gitleaks-scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.gitleaks-sidecar
    restart: unless-stopped
    volumes:
      - scanning_workspace:/workspace:ro
    networks:
      - nix_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # semgrep-scanner (§ Containerização, mesmo padrão de trivy-scanner/
  # gitleaks-scanner acima): sidecar de vida longa em torno do binário
  # `semgrep`, só lê o volume compartilhado. Único sidecar de scanning
  # cujo corpo de requisição também carrega `config` (o ruleset do
  # Semgrep Registry a rodar) — os outros três têm argumentos fixos, ver
  # cmd/semgrep-sidecar/main.go.
  semgrep-scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.semgrep-sidecar
    restart: unless-stopped
    volumes:
      - scanning_workspace:/workspace:ro
    networks:
      - nix_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # syft-scanner (§ Containerização — Fase 11, mesmo padrão de
  # trivy-scanner/gitleaks-scanner acima): sidecar de vida longa em torno
  # do binário `syft`, só lê o volume compartilhado.
  syft-scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.syft-sidecar
    restart: unless-stopped
    volumes:
      - scanning_workspace:/workspace:ro
    networks:
      - nix_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${WEBSOCKET_PUBLIC_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${WEBSOCKET_PUBLIC_URL:-ws://localhost:8000/ws}
      BACKEND_INTERNAL_URL: http://backend-api:8000
    networks:
      - nix_internal
    ports:
      - "3000:3000"
    depends_on:
      backend-api:
        condition: service_healthy
    # 127.0.0.1, não "localhost" (ver a mesma nota em backend-api): aqui
    # isto não é só uma precaução — sem ela o healthcheck falhava de
    # verdade. O server.js standalone do Next.js, com HOSTNAME=0.0.0.0
    # (ver o Dockerfile), escuta só no wildcard IPv4; "localhost" dentro
    # do container Alpine resolve para ::1 primeiro, então "wget --spider
    # http://localhost:3000" batia num socket IPv6 em que nada escutava e
    # o container ficava preso em "unhealthy" mesmo com o servidor
    # respondendo normalmente (inclusive pela porta publicada).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
