name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nix
          POSTGRES_USER: nix
          POSTGRES_PASSWORD: nix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nix -d nix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: nix
          RABBITMQ_DEFAULT_PASS: nix_password
          RABBITMQ_DEFAULT_VHOST: nix
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: go fmt (somente verificação)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Instala o goose (migrations)
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Roda as migrations no banco do CI
        run: goose -dir migrations postgres "postgres://nix:nix@localhost:5432/nix?sslmode=disable" up

      - name: go test (testes unitários + de integração com serviços reais)
        env:
          TEST_DATABASE_URL: postgres://nix:nix@localhost:5432/nix?sslmode=disable
          TEST_RABBITMQ_URL: amqp://nix:nix_password@localhost:5672/nix
        # -p 1: vários pacotes compartilham os mesmos containers de serviço
        # Postgres/RabbitMQ ao vivo acima em vez de mocká-los — serializa
        # os binários de teste de cada pacote para que linhas/mensagens de
        # um pacote não vazem para as asserções de outro (ver backend-test
        # no Makefile).
        run: go test ./... -timeout 180s -p 1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Placeholders válidos apenas em build-time — nunca segredos reais —
    # satisfazem as checagens fail-fast de lib/auth sem exigir um Keycloak
    # de verdade no CI.
    env:
      KEYCLOAK_ISSUER_URL: https://ci-placeholder.invalid/realms/ci
      KEYCLOAK_FRONTEND_CLIENT_ID: ci-placeholder
      KEYCLOAK_FRONTEND_CLIENT_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production-use
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (severidade high ou maior)
        run: npm audit --audit-level=high
        continue-on-error: true # apenas informativo — não bloqueia o CI por causa de advisories upstream

  docker:
    name: Docker Compose / build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker compose config (validação estrutural)
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build da imagem backend-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: false
          load: true # deixa a imagem disponível localmente para o Trivy escanear abaixo
          tags: nix-platform/backend-api:ci

      - name: Build da imagem backend-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          load: true
          tags: nix-platform/backend-worker:ci

      - name: Build da imagem frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: nix-platform/frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws

      # Sidecars de scanning (§ Containerização — cada scanner isolado no
      # próprio container, ver docs/roadmap-secops-orchestrator.md): 5
      # imagens a mais que nunca tinham build/scan nenhum aqui antes desta
      # mudança — cada uma carrega um runtime de terceiro (binário do
      # trivy/gitleaks/syft, venv Python do semgrep, JRE+Node.js do
      # sonar-scanner) que pode ter CVE tão real quanto backend-api/
      # backend-worker/frontend, e ficava fora da única superfície deste
      # CI que escaneia a imagem OCI final (não só código-fonte/deps
      # declaradas).
      - name: Build da imagem trivy-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.trivy-sidecar
          push: false
          load: true
          tags: nix-platform/trivy-scanner:ci

      - name: Build da imagem gitleaks-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.gitleaks-sidecar
          push: false
          load: true
          tags: nix-platform/gitleaks-scanner:ci

      - name: Build da imagem syft-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.syft-sidecar
          push: false
          load: true
          tags: nix-platform/syft-scanner:ci

      - name: Build da imagem semgrep-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.semgrep-sidecar
          push: false
          load: true
          tags: nix-platform/semgrep-scanner:ci

      - name: Build da imagem sonar-scanner-cli
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.sonar-sidecar
          push: false
          load: true
          tags: nix-platform/sonar-scanner-cli:ci

      # Escaneia cada imagem já construída em busca de CVEs conhecidas nos
      # pacotes do sistema operacional e nas dependências de linguagem
      # embutidas na imagem final — cobre uma superfície diferente do
      # govulncheck/npm audit acima (que só olham o código-fonte/deps
      # declaradas, não a imagem OCI resultante com todas as camadas).
      - name: Escaneia a imagem backend-api (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/backend-api:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem backend-worker (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/backend-worker:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem frontend (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/frontend:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem trivy-scanner (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/trivy-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem gitleaks-scanner (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/gitleaks-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem syft-scanner (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/syft-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem semgrep-scanner (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/semgrep-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem sonar-scanner-cli (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: nix-platform/sonar-scanner-cli:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # secscan: Fase 8 do roadmap de segurança
  # (docs/roadmap-secops-orchestrator.md) — um job ADICIONAL, não um
  # substituto de nenhum dos jobs acima (govulncheck no job "backend",
  # npm audit no "frontend", Trivy de imagem e gitleaks/CodeQL nos seus
  # próprios workflows continuam intactos). O valor aqui é
  # reprodutibilidade local: `make secscan` roda exatamente o mesmo
  # comando na máquina de um desenvolvedor antes mesmo de abrir um PR.
  # Mesmas versões pinadas de trivy/semgrep do backend/Dockerfile.worker
  # (nunca "latest").
  secscan:
    name: nix-secscan (CLI unificado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Instala o trivy (mesma versão pinada de backend/Dockerfile.worker, verificada por checksum)
        run: |
          TRIVY_VERSION=0.74.0
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Instala o semgrep (mesma versão pinada de backend/Dockerfile.worker)
        run: pip install --no-cache-dir --disable-pip-version-check "semgrep==1.174.0"

      - name: Builda o nix-secscan
        working-directory: backend
        run: go build -o /usr/local/bin/nix-secscan ./cmd/secscan

      - name: nix-secscan scan (trivy + semgrep contra o repositório inteiro)
        run: nix-secscan scan --repo . --scanners trivy,semgrep --fail-on CRITICAL
