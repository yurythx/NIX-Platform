name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nix
          POSTGRES_USER: nix
          POSTGRES_PASSWORD: nix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nix -d nix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: nix
          RABBITMQ_DEFAULT_PASS: nix_password
          RABBITMQ_DEFAULT_VHOST: nix
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: go fmt (somente verificação)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Instala o goose (migrations)
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Roda as migrations no banco do CI
        run: goose -dir migrations postgres "postgres://nix:nix@localhost:5432/nix?sslmode=disable" up

      - name: go test (testes unitários + de integração com serviços reais)
        env:
          TEST_DATABASE_URL: postgres://nix:nix@localhost:5432/nix?sslmode=disable
          TEST_RABBITMQ_URL: amqp://nix:nix_password@localhost:5672/nix
        # -p 1: vários pacotes compartilham os mesmos containers de serviço
        # Postgres/RabbitMQ ao vivo acima em vez de mocká-los — serializa
        # os binários de teste de cada pacote para que linhas/mensagens de
        # um pacote não vazem para as asserções de outro (ver backend-test
        # no Makefile).
        run: go test ./... -timeout 180s -p 1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Placeholders válidos apenas em build-time — nunca segredos reais —
    # satisfazem as checagens fail-fast de lib/auth sem exigir um Keycloak
    # de verdade no CI.
    env:
      KEYCLOAK_ISSUER_URL: https://ci-placeholder.invalid/realms/ci
      KEYCLOAK_FRONTEND_CLIENT_ID: ci-placeholder
      KEYCLOAK_FRONTEND_CLIENT_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production-use
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (severidade high ou maior)
        run: npm audit --audit-level=high
        continue-on-error: true # apenas informativo — não bloqueia o CI por causa de advisories upstream

  docker:
    name: Docker Compose / build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker compose config (validação estrutural)
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build da imagem backend-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: false
          load: true # deixa a imagem disponível localmente para o Trivy escanear abaixo
          tags: nix-platform/backend-api:ci

      - name: Build da imagem backend-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          load: true
          tags: nix-platform/backend-worker:ci

      - name: Build da imagem frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: nix-platform/frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws

      # Sidecars de scanning (§ Containerização — cada scanner isolado no
      # próprio container, ver docs/roadmap-secops-orchestrator.md): 5
      # imagens a mais que nunca tinham build/scan nenhum aqui antes desta
      # mudança — cada uma carrega um runtime de terceiro (binário do
      # trivy/gitleaks/syft, venv Python do semgrep, JRE+Node.js do
      # sonar-scanner) que pode ter CVE tão real quanto backend-api/
      # backend-worker/frontend, e ficava fora da única superfície deste
      # CI que escaneia a imagem OCI final (não só código-fonte/deps
      # declaradas).
      - name: Build da imagem trivy-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.trivy-sidecar
          push: false
          load: true
          tags: nix-platform/trivy-scanner:ci

      - name: Build da imagem gitleaks-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.gitleaks-sidecar
          push: false
          load: true
          tags: nix-platform/gitleaks-scanner:ci

      - name: Build da imagem syft-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.syft-sidecar
          push: false
          load: true
          tags: nix-platform/syft-scanner:ci

      - name: Build da imagem semgrep-scanner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.semgrep-sidecar
          push: false
          load: true
          tags: nix-platform/semgrep-scanner:ci

      - name: Build da imagem sonar-scanner-cli
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.sonar-sidecar
          push: false
          load: true
          tags: nix-platform/sonar-scanner-cli:ci

      # Escaneia cada imagem já construída em busca de CVEs conhecidas nos
      # pacotes do sistema operacional e nas dependências de linguagem
      # embutidas na imagem final — cobre uma superfície diferente do
      # govulncheck/npm audit acima (que só olham o código-fonte/deps
      # declaradas, não a imagem OCI resultante com todas as camadas).
      - name: Escaneia a imagem backend-api (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/backend-api:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem backend-worker (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/backend-worker:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem frontend (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/frontend:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem trivy-scanner (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/trivy-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem gitleaks-scanner (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/gitleaks-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem syft-scanner (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/syft-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem semgrep-scanner (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/semgrep-scanner:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Escaneia a imagem sonar-scanner-cli (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nix-platform/sonar-scanner-cli:ci
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # e2e: nenhum framework de ponta a ponta existia até esta fase — só
  # verificação manual registrada como texto no roadmap ("verificado ao
  # vivo"). Sobe a stack REAL via docker compose (o mesmo
  # docker-compose.yml que produção usa, não uma versão paralela
  # simplificada só pro CI) e roda Playwright contra ela — login local,
  # dashboard, logout (RP-Initiated), e as páginas públicas.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      # .env a partir do exemplo, só preenchendo o que docker compose
      # exige ter ALGUM valor pra interpolar o arquivo inteiro (mesmo os
      # serviços que este job nem sobe, ex.: zap/sonarqube) — nunca
      # segredos reais, só o suficiente pra "docker compose up" não
      # falhar validando o arquivo inteiro.
      - name: Prepara .env e a chave RSA do login local
        run: |
          cp .env.example .env
          sed -i 's/^SCANNING_ZAP_API_KEY=$/SCANNING_ZAP_API_KEY=ci-placeholder/' .env
          sed -i 's/^KEYCLOAK_CLIENT_SECRET=$/KEYCLOAK_CLIENT_SECRET=ci-placeholder/' .env
          mkdir -p secrets
          openssl genrsa -out secrets/local_auth_private_key.pem 2048
          chmod 644 secrets/local_auth_private_key.pem

      # postgres/rabbitmq via docker-compose.dev.yml (publica as portas
      # no host, necessário pro goose rodar migrations daqui de fora) —
      # cria a rede nix_internal, usada pelo Keycloak descartável abaixo.
      - name: Sobe postgres/rabbitmq
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres rabbitmq

      - name: Roda as migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir backend/migrations postgres "postgres://nix:change-me@localhost:5432/nix?sslmode=disable" up

      # Cria o usuário local que auth.spec.ts usa pra logar (achado de
      # auditoria de segurança: a migration 000027 removeu o
      # admin/Admin123! que a 000011 semeava — senha pública e conhecida
      # — então este job precisa criar sua PRÓPRIA conta de teste, com
      # senha gerada aqui mesmo, nunca commitada em lugar nenhum). A senha
      # some com o job — nunca aparece em log (GITHUB_ENV não ecoa o
      # valor), nunca é a mesma entre execuções.
      - name: Cria o usuário admin local pro E2E (make seed-admin)
        run: |
          E2E_ADMIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          cd backend && DB_HOST=localhost DB_PORT=5432 DB_NAME=nix DB_USER=nix DB_PASSWORD=change-me \
            go run ./cmd/seedadmin --password "$E2E_ADMIN_PASSWORD"

      # Keycloak descartável (§ login local coexiste com Keycloak, mas o
      # backend faz discovery OIDC eager no boot mesmo se ninguém for
      # usar SSO neste job — ver internal/platform/auth/oidc.go) — modo
      # dev, sem provisionar realm/client nenhum: só o discovery do realm
      # "master" (que já existe por padrão) precisa responder.
      - name: Sobe um Keycloak descartável (só pro backend inicializar)
        run: |
          docker run -d --name e2e-keycloak --network nix-platform_nix_internal -p 8081:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0 start-dev
          sed -i 's#^KEYCLOAK_ISSUER_URL=.*#KEYCLOAK_ISSUER_URL=http://e2e-keycloak:8080/realms/master#' .env
          # Checa via a porta publicada no host, não com "docker exec ...
          # curl" — a imagem do Keycloak não tem curl (nem nenhum outro
          # cliente HTTP) instalado, achado real rodando isto ao vivo.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/realms/master/.well-known/openid-configuration && break
            sleep 3
          done

      - name: Builda e sobe o backend-api
        run: docker compose up -d --build backend-api

      - name: Espera o backend-api responder
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend-api nunca respondeu" >&2
          docker logs nix-platform-backend-api-1 || true
          exit 1

      - name: Instala as dependências do frontend + navegador do Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Builda o frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          KEYCLOAK_ISSUER_URL: https://ci-placeholder.invalid/realms/ci
          KEYCLOAK_FRONTEND_CLIENT_ID: ci-placeholder
          KEYCLOAK_FRONTEND_CLIENT_SECRET: ci-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production-use
        run: npm run build

      - name: Sobe o frontend em segundo plano
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          KEYCLOAK_ISSUER_URL: https://ci-placeholder.invalid/realms/ci
          KEYCLOAK_FRONTEND_CLIENT_ID: ci-placeholder
          KEYCLOAK_FRONTEND_CLIENT_SECRET: ci-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production-use
        run: |
          nohup npm run start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "frontend nunca respondeu" >&2
          cat /tmp/frontend.log
          exit 1

      - name: Roda os testes E2E (Playwright)
        working-directory: frontend
        # E2E_ADMIN_PASSWORD já está no ambiente deste job desde o passo
        # "Cria o usuário admin local pro E2E" (via $GITHUB_ENV) — não
        # precisa ser repetida aqui, mas auth.spec.ts depende dela.
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Publica o relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Desmonta a stack
        if: always()
        run: docker compose down -v

  # secscan: Fase 8 do roadmap de segurança
  # (docs/roadmap-secops-orchestrator.md) — um job ADICIONAL, não um
  # substituto de nenhum dos jobs acima (govulncheck no job "backend",
  # npm audit no "frontend", Trivy de imagem e gitleaks/CodeQL nos seus
  # próprios workflows continuam intactos). O valor aqui é
  # reprodutibilidade local: `make secscan` roda exatamente o mesmo
  # comando na máquina de um desenvolvedor antes mesmo de abrir um PR.
  # Mesmas versões pinadas de trivy/semgrep do backend/Dockerfile.worker
  # (nunca "latest").
  secscan:
    name: nix-secscan (CLI unificado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Instala o trivy (mesma versão pinada de backend/Dockerfile.worker, verificada por checksum)
        run: |
          TRIVY_VERSION=0.74.0
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Instala o semgrep (mesma versão pinada de backend/Dockerfile.worker)
        run: pip install --no-cache-dir --disable-pip-version-check "semgrep==1.174.0"

      - name: Builda o nix-secscan
        working-directory: backend
        run: go build -o /usr/local/bin/nix-secscan ./cmd/secscan

      - name: nix-secscan scan (trivy + semgrep contra o repositório inteiro)
        run: nix-secscan scan --repo . --scanners trivy,semgrep --fail-on CRITICAL
